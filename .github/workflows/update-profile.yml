name: Update profile card

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - config/**
      - assets/fonts/**
      - package.json
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'aashishgaire999/aashishgaire999' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test generator
        run: npm test

      - name: Fetch public GitHub data and render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run update

      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dark.svg assets/profile-light.svg data/profile.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile card"
          git push
